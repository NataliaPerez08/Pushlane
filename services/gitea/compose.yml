services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: "${GITEA_DB_PASSWORD:?definir GITEA_DB_PASSWORD en el .env}"
    volumes:
      - gitea_db:/var/lib/postgresql/data

  gitea:
    image: docker.gitea.com/gitea:1.24
    restart: unless-stopped
    depends_on:
      - db
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: "${GITEA_DB_PASSWORD:?definir GITEA_DB_PASSWORD en el .env}"
      # Arrancar ya instalada (sin asistente) con la identidad del lab.
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DOMAIN: gitea.lab.local
      GITEA__server__SSH_DOMAIN: gitea.lab.local
      GITEA__server__ROOT_URL: http://gitea.lab.local:3000/
      GITEA__server__SSH_PORT: "2222"
      # Las cuentas se crean via API/CLI, no por registro abierto.
      GITEA__service__DISABLE_REGISTRATION: "true"
      # Gitea 1.24 restringe los webhooks salientes por defecto; permitir
      # el envío a hosts internos (RFC1918) para que CI alcance Jenkins.
      GITEA__webhook__ALLOWED_HOST_LIST: "private"
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - gitea_data:/data

volumes:
  gitea_db:
  gitea_data:

