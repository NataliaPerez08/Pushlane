services:
  jenkins:
    # Imagen construida desde el Dockerfile del directorio: base LTS con
    # los plugins de plugins.txt ya instalados (ver rol jenkins).
    build: .
    image: pushlane-jenkins:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      # Sin asistente: toda la configuracion entra por JCasC.
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: "/var/jenkins_config/casc.yaml"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc:/var/jenkins_config:ro

volumes:
  jenkins_home:
