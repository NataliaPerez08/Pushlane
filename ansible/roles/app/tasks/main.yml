---
# El pipeline despliega como devops (miembro del grupo docker): el directorio y
# los archivos deben ser accesibles para ese grupo, no solo root.
- name: Make the deployment tree traversable for devops
  ansible.builtin.file:
    path: /opt/pushlane
    owner: root
    group: docker
    mode: "0750"

- name: Create deployment directory
  ansible.builtin.file:
    path: /opt/pushlane/app
    state: directory
    owner: root
    group: docker
    mode: "0770"

- name: Install application Compose definition
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../services/app/compose.yml"
    dest: /opt/pushlane/app/compose.yml
    owner: root
    group: docker
    mode: "0664"

- name: Install deployment environment example
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../services/app/.env.example"
    dest: /opt/pushlane/app/.env.example
    owner: root
    group: docker
    mode: "0664"

# La llave dedicada de CI (credencial pushlane-app-ssh del Jenkinsfile) se
# genera en el nodo de control (rol jenkins) y despliega como devops.
- name: Authorize the CI deploy key for devops
  ansible.posix.authorized_key:
    user: devops
    state: present
    key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/pushlane-ci-deploy.pub') }}"

