---
- name: Install Docker packages from distribution repositories
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true

- name: Enable Docker
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Add the remote user to the Docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

