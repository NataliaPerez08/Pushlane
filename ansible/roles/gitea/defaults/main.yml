---
# Identidad de la instancia; los passwords viven en el vault del grupo gitea.
gitea_org_name: homelab
gitea_admin_user: gitea-admin
gitea_admin_email: gitea-admin@lab.local
gitea_repos:
  - demo-api
  - infrastructure
gitea_lab_users:
  devops:
    email: devops@lab.local
    password: "{{ devops_user_password }}"
  developer:
    email: developer@lab.local
    password: "{{ developer_user_password }}"
  # Usuario de integracion: clone y estados de PR desde Jenkins (Fase 4).
  jenkins:
    email: jenkins@lab.local
    password: "{{ gitea_jenkins_password }}"
gitea_control_key_title: pushlane-ecs
gitea_team_name: developers
# Los required status checks sobre main solo tienen sentido en el repo cuyo
# pipeline CI se construye (infrastructure); demo-api no tiene jobs propios.
gitea_status_check_repos:
  - infrastructure
gitea_status_check_context: infrastructure/pipeline/head
