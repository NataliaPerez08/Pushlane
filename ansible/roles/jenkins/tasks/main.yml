---
- name: Create Jenkins service directory
  ansible.builtin.file:
    path: /opt/pushlane/jenkins
    state: directory
    mode: "0750"

- name: Install Jenkins Compose definition
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../services/jenkins/compose.yml"
    dest: /opt/pushlane/jenkins/compose.yml
    mode: "0640"

- name: Start Jenkins
  community.docker.docker_compose_v2:
    project_src: /opt/pushlane/jenkins
    state: present

