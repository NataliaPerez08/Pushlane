---
- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - jq
      - python3-pip
    state: present
    update_cache: true

- name: Enable time synchronization
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: started
    enabled: true

